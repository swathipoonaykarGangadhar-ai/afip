<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AFIP — Investigation Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0D1117; --surface:#151B23; --surface-raised:#1C242F; --surface-hover:#212B37;
    --border:#262E39; --border-strong:#374254;
    --text:#E6E9EF; --text-muted:#8B93A1; --text-faint:#5B6472;
    --critical:#F0555A; --high:#E5A03D; --medium:#D9C548; --low:#5B8DEF;
    --safe:#3FB968; --pending:#E5A03D; --accent:#5B8DEF;
    --mono: 'IBM Plex Mono', ui-monospace, monospace;
    --sans: 'IBM Plex Sans', system-ui, sans-serif;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    background:var(--bg); color:var(--text); font-family:var(--sans);
    font-size:14px; line-height:1.5; -webkit-font-smoothing:antialiased;
  }
  ::selection{background:var(--accent); color:#fff;}
  a{color:var(--accent);}
  button{font-family:inherit; cursor:pointer;}
  input,textarea,select{font-family:inherit; font-size:inherit;}

  /* ---- Top bar ---- */
  .topbar{
    height:52px; display:flex; align-items:center; justify-content:space-between;
    padding:0 20px; border-bottom:1px solid var(--border); background:var(--surface);
  }
  .brand{display:flex; align-items:center; gap:10px;}
  .brand .mark{
    width:22px; height:22px; border-radius:5px; background:linear-gradient(135deg, var(--accent), #3a6fd8);
    display:flex; align-items:center; justify-content:center; font-family:var(--mono); font-weight:600; font-size:11px; color:#fff;
  }
  .brand .name{font-weight:600; letter-spacing:0.2px;}
  .brand .sub{color:var(--text-faint); font-size:12px; margin-left:8px; font-family:var(--mono);}
  .topbar-right{display:flex; align-items:center; gap:14px;}
  .conn-dot{width:7px; height:7px; border-radius:50%; background:var(--text-faint); display:inline-block; margin-right:6px;}
  .conn-dot.ok{background:var(--safe); box-shadow:0 0 6px var(--safe);}
  .conn-dot.err{background:var(--critical); box-shadow:0 0 6px var(--critical);}
  .conn-label{font-family:var(--mono); font-size:12px; color:var(--text-muted);}
  #apiKeyInput{
    background:var(--surface-raised); border:1px solid var(--border-strong); color:var(--text);
    padding:6px 10px; border-radius:6px; font-family:var(--mono); font-size:12px; width:220px;
  }
  #apiKeyInput:focus{outline:none; border-color:var(--accent);}

  /* ---- Layout ---- */
  .console{display:grid; grid-template-columns:380px 1fr; height:calc(100vh - 52px);}
  .queue{border-right:1px solid var(--border); display:flex; flex-direction:column; overflow:hidden;}
  .queue-header{padding:16px 18px 10px; border-bottom:1px solid var(--border);}
  .queue-header h2{font-size:13px; text-transform:uppercase; letter-spacing:0.06em; color:var(--text-muted); font-weight:600;}
  .queue-filters{display:flex; gap:6px; margin-top:10px; flex-wrap:wrap;}
  .filter-chip{
    padding:4px 10px; border-radius:20px; border:1px solid var(--border-strong); background:transparent;
    color:var(--text-muted); font-size:11.5px; font-family:var(--mono); transition:all .12s;
  }
  .filter-chip:hover{border-color:var(--accent);}
  .filter-chip.active{background:var(--accent); border-color:var(--accent); color:#fff;}
  .queue-list{flex:1; overflow-y:auto;}
  .ticket-row{
    padding:13px 18px; border-bottom:1px solid var(--border); cursor:pointer; transition:background .1s;
    display:flex; flex-direction:column; gap:5px;
  }
  .ticket-row:hover{background:var(--surface);}
  .ticket-row.selected{background:var(--surface-raised); border-left:3px solid var(--accent); padding-left:15px;}
  .ticket-top{display:flex; align-items:center; justify-content:space-between;}
  .ticket-id{font-family:var(--mono); font-size:12.5px; color:var(--text);}
  .priority-dot{width:8px; height:8px; border-radius:50%; display:inline-block; margin-right:7px; flex-shrink:0;}
  .p-CRITICAL{background:var(--critical); box-shadow:0 0 5px var(--critical);}
  .p-HIGH{background:var(--high);}
  .p-MEDIUM{background:var(--medium);}
  .p-LOW{background:var(--low);}
  .ticket-meta{display:flex; justify-content:space-between; font-size:12px; color:var(--text-muted);}
  .ticket-amount{font-family:var(--mono);}
  .status-pill{
    font-size:10.5px; font-family:var(--mono); padding:2px 7px; border-radius:4px; text-transform:uppercase;
    letter-spacing:0.03em; font-weight:600;
  }
  .status-PENDING_APPROVAL{background:rgba(229,160,61,0.15); color:var(--pending);}
  .status-OPEN{background:rgba(91,141,239,0.15); color:var(--accent);}
  .status-CLOSED{background:rgba(63,185,104,0.15); color:var(--safe);}
  .empty-state{padding:40px 24px; text-align:center; color:var(--text-faint);}

  /* ---- Detail pane ---- */
  .detail{overflow-y:auto; display:flex; flex-direction:column;}
  .detail-empty{
    flex:1; display:flex; align-items:center; justify-content:center; flex-direction:column; gap:10px;
    color:var(--text-faint);
  }
  .detail-empty .glyph{font-size:34px; opacity:0.3; font-family:var(--mono);}
  .detail-header{padding:22px 28px 18px; border-bottom:1px solid var(--border);}
  .detail-header-top{display:flex; justify-content:space-between; align-items:flex-start; gap:20px;}
  .detail-title{font-family:var(--mono); font-size:20px; font-weight:600;}
  .detail-sub{color:var(--text-muted); font-size:13px; margin-top:4px;}
  .risk-badge{
    font-family:var(--mono); font-size:22px; font-weight:600; text-align:right;
  }
  .risk-badge .lbl{font-size:10.5px; color:var(--text-faint); text-transform:uppercase; letter-spacing:0.05em; font-weight:500; display:block; margin-bottom:2px;}
  .field-row{display:flex; gap:20px; margin-top:16px; flex-wrap:wrap;}
  .field{display:flex; flex-direction:column; gap:5px;}
  .field label{font-size:11px; color:var(--text-faint); text-transform:uppercase; letter-spacing:0.05em;}
  .field select, .field input{
    background:var(--surface-raised); border:1px solid var(--border-strong); color:var(--text);
    padding:6px 10px; border-radius:6px; font-size:12.5px; min-width:140px;
  }

  .section{padding:22px 28px; border-bottom:1px solid var(--border);}
  .section h3{font-size:12px; text-transform:uppercase; letter-spacing:0.06em; color:var(--text-muted); font-weight:600; margin-bottom:14px;}

  /* Evidence trail — signature element */
  .trail{position:relative; padding-left:26px;}
  .trail::before{content:''; position:absolute; left:7px; top:6px; bottom:6px; width:1.5px; background:var(--border-strong);}
  .trail-step{position:relative; padding-bottom:20px;}
  .trail-step:last-child{padding-bottom:0;}
  .trail-dot{
    position:absolute; left:-26px; top:2px; width:15px; height:15px; border-radius:50%;
    background:var(--surface); border:2px solid var(--border-strong); display:flex; align-items:center; justify-content:center;
  }
  .trail-dot.flag{border-color:var(--critical); background:rgba(240,85,90,0.15);}
  .trail-dot.clear{border-color:var(--safe); background:rgba(63,185,104,0.15);}
  .trail-agent{font-family:var(--mono); font-size:12.5px; font-weight:600; color:var(--text);}
  .trail-finding{font-size:13px; color:var(--text-muted); margin-top:3px;}
  .trail-flags{display:flex; gap:6px; flex-wrap:wrap; margin-top:6px;}
  .tag{
    font-family:var(--mono); font-size:10.5px; padding:2px 7px; border-radius:4px;
    background:var(--surface-raised); border:1px solid var(--border-strong); color:var(--text-muted);
  }
  .tag.warn{border-color:var(--critical); color:var(--critical);}

  .ring-box{background:var(--surface-raised); border:1px solid var(--border-strong); border-radius:8px; padding:14px 16px;}
  .ring-accounts{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:12px;}
  .acct-chip{font-family:var(--mono); font-size:11.5px; background:var(--surface); border:1px solid var(--border-strong); padding:3px 8px; border-radius:5px;}
  .transfer-row{display:flex; align-items:center; gap:8px; font-family:var(--mono); font-size:12px; color:var(--text-muted); padding:4px 0;}
  .transfer-row .amt{color:var(--critical); font-weight:600;}
  .transfer-row .arrow{color:var(--text-faint);}

  .action-bar{display:flex; gap:10px; padding:18px 28px; border-bottom:1px solid var(--border); background:var(--surface);}
  .btn{
    padding:9px 18px; border-radius:7px; font-size:13px; font-weight:600; border:1px solid transparent;
    display:flex; align-items:center; gap:7px; transition:opacity .12s;
  }
  .btn:hover{opacity:0.88;}
  .btn:disabled{opacity:0.4; cursor:not-allowed;}
  .btn-approve{background:var(--safe); color:#06170D;}
  .btn-reject{background:transparent; border-color:var(--critical); color:var(--critical);}
  .btn-sar{background:var(--accent); color:#fff;}
  .btn-ghost{background:transparent; border-color:var(--border-strong); color:var(--text-muted);}

  .sar-output{
    margin-top:14px; background:var(--surface-raised); border:1px solid var(--border-strong); border-radius:8px;
    padding:16px; font-family:var(--mono); font-size:12px; white-space:pre-wrap; color:var(--text-muted); line-height:1.6;
  }

  .comment{padding:10px 0; border-bottom:1px solid var(--border);}
  .comment:last-child{border-bottom:none;}
  .comment-meta{font-size:11.5px; color:var(--text-faint); font-family:var(--mono); margin-bottom:3px;}
  .comment-author{color:var(--text-muted); font-weight:600;}
  .comment-form{display:flex; gap:8px; margin-top:12px;}
  .comment-form input{flex:1; background:var(--surface-raised); border:1px solid var(--border-strong); color:var(--text); padding:8px 12px; border-radius:6px;}
  .comment-form button{background:var(--surface-raised); border:1px solid var(--border-strong); color:var(--text); padding:8px 14px; border-radius:6px;}

  /* Chat */
  .chat-section{padding:0; border-bottom:none; flex:1; display:flex; flex-direction:column;}
  .chat-header{padding:16px 28px 12px; border-bottom:1px solid var(--border);}
  .chat-log{flex:1; padding:16px 28px; overflow-y:auto; display:flex; flex-direction:column; gap:12px; min-height:120px;}
  .chat-msg{max-width:82%; padding:10px 13px; border-radius:10px; font-size:13px; line-height:1.5;}
  .chat-msg.user{align-self:flex-end; background:var(--accent); color:#fff; border-bottom-right-radius:3px;}
  .chat-msg.assistant{align-self:flex-start; background:var(--surface-raised); border:1px solid var(--border-strong); border-bottom-left-radius:3px;}
  .chat-input-row{display:flex; gap:8px; padding:14px 28px 22px; border-top:1px solid var(--border);}
  .chat-input-row input{flex:1; background:var(--surface-raised); border:1px solid var(--border-strong); color:var(--text); padding:10px 14px; border-radius:20px;}
  .chat-input-row button{background:var(--accent); color:#fff; border:none; width:38px; height:38px; border-radius:50%; display:flex; align-items:center; justify-content:center; flex-shrink:0;}
  .chat-hint{color:var(--text-faint); font-size:12px; padding:0 28px 8px;}

  ::-webkit-scrollbar{width:9px;}
  ::-webkit-scrollbar-track{background:transparent;}
  ::-webkit-scrollbar-thumb{background:var(--border-strong); border-radius:5px;}
</style>
</head>
<body>

<div class="topbar">
  <div class="brand">
    <div class="mark">AF</div>
    <div class="name">AFIP Console</div>
    <div class="sub">agentic fraud investigation</div>
  </div>
  <div class="topbar-right">
    <span class="conn-label"><span class="conn-dot" id="connDot"></span><span id="connLabel">checking…</span></span>
    <input id="apiKeyInput" type="password" placeholder="X-API-Key">
  </div>
</div>

<div class="console">
  <div class="queue">
    <div class="queue-header">
      <h2>Case Queue</h2>
      <div class="queue-filters" id="filters">
        <button class="filter-chip active" data-status="">All</button>
        <button class="filter-chip" data-status="PENDING_APPROVAL">Pending</button>
        <button class="filter-chip" data-status="OPEN">Open</button>
        <button class="filter-chip" data-status="CLOSED">Closed</button>
      </div>
    </div>
    <div class="queue-list" id="queueList">
      <div class="empty-state">Set your API key above to load cases.</div>
    </div>
  </div>

  <div class="detail" id="detail">
    <div class="detail-empty">
      <div class="glyph">◇</div>
      <div>Select a case from the queue</div>
    </div>
  </div>
</div>

<script>
const API = window.location.origin;
let apiKey = sessionStorage.getItem('afip_key') || '';
let cases = [];
let selectedCase = null;
let statusFilter = '';
let chatHistory = [];

const el = id => document.getElementById(id);
el('apiKeyInput').value = apiKey;
el('apiKeyInput').addEventListener('change', e => {
  apiKey = e.target.value.trim();
  sessionStorage.setItem('afip_key', apiKey);
  loadCases();
});

function headers(json=true){
  const h = {};
  if(apiKey) h['X-API-Key'] = apiKey;
  if(json) h['Content-Type'] = 'application/json';
  return h;
}

async function checkHealth(){
  try{
    const r = await fetch(API + '/health');
    const d = await r.json();
    el('connDot').className = 'conn-dot ok';
    el('connLabel').textContent = `live · ${d.graph_backend} · ${d.persistent_storage ? 'persistent' : 'in-memory store'}`;
  }catch(e){
    el('connDot').className = 'conn-dot err';
    el('connLabel').textContent = 'unreachable';
  }
}

async function loadCases(){
  if(!apiKey){
    el('queueList').innerHTML = '<div class="empty-state">Set your API key above to load cases.</div>';
    return;
  }
  try{
    const url = API + '/cases' + (statusFilter ? `?status=${statusFilter}` : '');
    const r = await fetch(url, {headers: headers(false)});
    if(r.status === 401){
      el('queueList').innerHTML = '<div class="empty-state">Invalid API key.</div>';
      return;
    }
    const d = await r.json();
    cases = d.cases.sort((a,b) => (b.created_date||'').localeCompare(a.created_date||''));
    renderQueue();
  }catch(e){
    el('queueList').innerHTML = '<div class="empty-state">Failed to load cases.</div>';
  }
}

function renderQueue(){
  if(cases.length === 0){
    el('queueList').innerHTML = '<div class="empty-state">No cases yet. Run /investigate on a transaction to create one.</div>';
    return;
  }
  el('queueList').innerHTML = cases.map(c => `
    <div class="ticket-row ${selectedCase && selectedCase.case_id===c.case_id ? 'selected':''}" onclick="selectCase('${c.case_id}')">
      <div class="ticket-top">
        <span class="ticket-id"><span class="priority-dot p-${c.priority||'LOW'}"></span>${c.case_id}</span>
        <span class="status-pill status-${c.status}">${c.status.replace('_',' ')}</span>
      </div>
      <div class="ticket-meta">
        <span>${c.transaction ? c.transaction.merchant : ''} · ${c.customer ? c.customer.name : ''}</span>
        <span class="ticket-amount">$${c.transaction ? c.transaction.amount.toFixed(2) : '0.00'}</span>
      </div>
    </div>
  `).join('');
}

document.querySelectorAll('.filter-chip').forEach(chip => {
  chip.addEventListener('click', () => {
    document.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
    chip.classList.add('active');
    statusFilter = chip.dataset.status;
    loadCases();
  });
});

async function selectCase(caseId){
  const r = await fetch(API + `/case/${caseId}`, {headers: headers(false)});
  selectedCase = await r.json();
  chatHistory = [];
  renderQueue();
  renderDetail();
}

const AGENT_STEPS = [
  {key:'transaction_findings', name:'Transaction Agent', flagKey:'flags'},
  {key:'customer_findings', name:'Customer Agent', flagKey:'flags'},
  {key:'graph_findings', name:'GraphRAG Agent', flagKey:null},
  {key:'compliance_findings', name:'Compliance Agent', flagKey:'flags'},
];

function renderDetail(){
  const c = selectedCase;
  if(!c){ el('detail').innerHTML = '<div class="detail-empty"><div class="glyph">◇</div><div>Select a case from the queue</div></div>'; return; }

  const risk = c.final_risk_score != null ? c.final_risk_score : 0;
  const riskColor = risk >= 0.8 ? 'var(--critical)' : risk >= 0.5 ? 'var(--high)' : 'var(--safe)';

  let trailHtml = AGENT_STEPS.map(step => {
    const f = c.agent_result ? c.agent_result[step.key] : null;
    if(!f) return '';
    let finding = '';
    let flagged = false;
    if(step.key === 'graph_findings'){
      flagged = f.in_fraud_ring;
      finding = f.in_fraud_ring ? `Fraud ring detected — ${f.ring.ring_participants.length} linked accounts via ${f.ring.shared_entity}` : 'No fraud ring detected';
    } else {
      const flags = f.flags || [];
      flagged = flags.length > 0;
      finding = flags.length ? `${flags.length} flag(s) raised` : 'No flags raised';
    }
    const flagsHtml = (step.key !== 'graph_findings' && f.flags && f.flags.length)
      ? `<div class="trail-flags">${f.flags.map(fl => `<span class="tag warn">${fl}</span>`).join('')}</div>` : '';
    return `
      <div class="trail-step">
        <div class="trail-dot ${flagged ? 'flag':'clear'}"></div>
        <div class="trail-agent">${step.name}</div>
        <div class="trail-finding">${finding}</div>
        ${flagsHtml}
      </div>`;
  }).join('');

  let ringHtml = '';
  const gf = c.agent_result && c.agent_result.graph_findings;
  if(gf && gf.in_fraud_ring){
    const ring = gf.ring;
    ringHtml = `
      <div class="section">
        <h3>Fraud Ring Evidence</h3>
        <div class="ring-box">
          <div class="ring-accounts">${ring.ring_participants.map(a => `<span class="acct-chip">${a}</span>`).join('')}</div>
          ${ring.transfer_chain.map(t => `
            <div class="transfer-row">
              <span>${t.from}</span><span class="arrow">→</span><span>${t.to}</span>
              <span class="amt">$${t.amount.toFixed(2)}</span>
              <span style="color:var(--text-faint); font-size:11px;">${(t.timestamp||'').replace('T',' ').slice(0,16)}</span>
            </div>`).join('')}
        </div>
      </div>`;
  }

  let actionsHtml = '';
  if(c.status === 'PENDING_APPROVAL'){
    actionsHtml = `
      <div class="action-bar">
        <button class="btn btn-approve" onclick="approveCase('approved')">✓ Approve SAR Escalation</button>
        <button class="btn btn-reject" onclick="approveCase('rejected')">✕ Reject</button>
      </div>`;
  } else if(c.final_decision === 'ESCALATE_SAR'){
    actionsHtml = `
      <div class="action-bar">
        <button class="btn btn-sar" onclick="generateSar()">Generate SAR Narrative</button>
      </div>
      <div id="sarOutput"></div>`;
  }

  el('detail').innerHTML = `
    <div class="detail-header">
      <div class="detail-header-top">
        <div>
          <div class="detail-title">${c.case_id}</div>
          <div class="detail-sub">${c.transaction ? c.transaction.transaction_id : ''} · ${c.customer ? c.customer.name : 'Unknown'} (${c.customer ? c.customer.customer_id : ''})</div>
        </div>
        <div class="risk-badge" style="color:${riskColor}">
          <span class="lbl">Risk Score</span>
          ${(risk*100).toFixed(0)}%
        </div>
      </div>
      <div class="field-row">
        <div class="field">
          <label>Priority</label>
          <select onchange="updateCase({priority:this.value})">
            ${['LOW','MEDIUM','HIGH','CRITICAL'].map(p => `<option value="${p}" ${c.priority===p?'selected':''}>${p}</option>`).join('')}
          </select>
        </div>
        <div class="field">
          <label>Assignee</label>
          <input type="text" value="${c.assignee || ''}" placeholder="Unassigned" onchange="updateCase({assignee:this.value})">
        </div>
        <div class="field">
          <label>Status</label>
          <input type="text" value="${c.status}" disabled style="opacity:0.6;">
        </div>
      </div>
    </div>

    ${actionsHtml}

    <div class="section">
      <h3>Evidence Trail</h3>
      <div class="trail">${trailHtml}</div>
    </div>

    ${ringHtml}

    <div class="section">
      <h3>Analyst Notes</h3>
      <div id="commentsList">${renderComments(c.comments || [])}</div>
      <div class="comment-form">
        <input type="text" id="commentInput" placeholder="Add a note…" onkeydown="if(event.key==='Enter') addComment()">
        <button onclick="addComment()">Post</button>
      </div>
    </div>

    <div class="section chat-section" style="flex:1; display:flex; flex-direction:column; padding-left:0; padding-right:0;">
      <div class="chat-header" style="padding-left:28px; padding-right:28px;"><h3 style="margin-bottom:0;">Ask about this case</h3></div>
      <div class="chat-log" id="chatLog"></div>
      <div class="chat-input-row">
        <input type="text" id="chatInput" placeholder="e.g. Why was this flagged?" onkeydown="if(event.key==='Enter') sendChat()">
        <button onclick="sendChat()">→</button>
      </div>
    </div>
  `;
  if(document.getElementById('sarOutput') && c.sar_narrative){
    document.getElementById('sarOutput').innerHTML = `<div class="sar-output" style="margin:0 28px 18px;">${c.sar_narrative}</div>`;
  }
}

function renderComments(comments){
  if(!comments.length) return '<div style="color:var(--text-faint); font-size:12.5px;">No notes yet.</div>';
  return comments.map(cm => `
    <div class="comment">
      <div class="comment-meta"><span class="comment-author">${cm.author}</span> · ${(cm.timestamp||'').replace('T',' ').slice(0,16)}</div>
      <div>${cm.text}</div>
    </div>`).join('');
}

async function updateCase(patch){
  const r = await fetch(API + `/case/${selectedCase.case_id}`, {method:'PATCH', headers: headers(), body: JSON.stringify(patch)});
  selectedCase = await r.json();
  renderQueue();
}

async function addComment(){
  const input = el('commentInput');
  if(!input.value.trim()) return;
  const r = await fetch(API + `/case/${selectedCase.case_id}/comment`, {
    method:'POST', headers: headers(), body: JSON.stringify({author: 'analyst', text: input.value.trim()})
  });
  selectedCase = await r.json();
  input.value = '';
  document.getElementById('commentsList').innerHTML = renderComments(selectedCase.comments);
}

async function approveCase(decision){
  const r = await fetch(API + `/case/${selectedCase.case_id}/approve`, {
    method:'POST', headers: headers(), body: JSON.stringify({decision})
  });
  selectedCase = await r.json();
  renderQueue();
  renderDetail();
}

async function generateSar(){
  const r = await fetch(API + `/sar/${selectedCase.case_id}`, {method:'POST', headers: headers(false)});
  const d = await r.json();
  selectedCase.sar_narrative = d.sar_narrative;
  document.getElementById('sarOutput').innerHTML = `<div class="sar-output" style="margin:0 28px 18px;">${d.sar_narrative}</div>`;
}

async function sendChat(){
  const input = el('chatInput');
  const msg = input.value.trim();
  if(!msg) return;
  input.value = '';
  const log = el('chatLog');
  log.innerHTML += `<div class="chat-msg user">${msg}</div>`;
  log.scrollTop = log.scrollHeight;

  const r = await fetch(API + `/case/${selectedCase.case_id}/chat`, {
    method:'POST', headers: headers(), body: JSON.stringify({message: msg, history: chatHistory})
  });
  const d = await r.json();
  chatHistory.push({role:'user', content: msg});
  chatHistory.push({role:'assistant', content: d.reply});
  log.innerHTML += `<div class="chat-msg assistant">${d.reply}</div>`;
  log.scrollTop = log.scrollHeight;
}

checkHealth();
loadCases();
setInterval(checkHealth, 15000);
</script>
</body>
